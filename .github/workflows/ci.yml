name: CI Quality Gate & Alert

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Install pnpm FIRST
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # You can specify a version, 9 is standard for Node 20

      # 2. Setup Node with pnpm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # 3. Use pnpm for all commands
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript Type Check
        run: pnpm exec tsc --noEmit

      - name: Discord Alert on Failure
        if: failure() && github.event_name == 'push'
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "🚨 **CRITICAL:** The build is failing on the `main` branch! Someone might have pushed directly or merged a broken PR. Fix immediately!"}' \
          ${{ secrets.DISCORD_WEBHOOK }}