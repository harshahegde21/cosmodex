name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, closed, synchronize] # Listen for opening, closing (merging), and updating PRs
    branches: [ "main" ]

jobs:
  # ---------------------------------------------------------
  # JOB 1: The Quality Gate
  # ---------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- NOTIFICATION: PR OPENED ---
      - name: Discord Alert - PR Opened
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        run: |
          MSG="🚀 **New Pull Request!** \n**Author:** ${{ github.actor }}\n**Title:** ${{ github.event.pull_request.title }}\n**Link:** ${{ github.event.pull_request.html_url }}"
          curl -H "Content-Type: application/json" -d "{\"content\": \"$MSG\"}" ${{ secrets.DISCORD_WEBHOOK }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript Type Check
        run: pnpm exec tsc --noEmit

      # --- NOTIFICATION: BUILD FAILED ---
      - name: Discord Alert - Quality Gate Failed
        if: failure() 
        run: |
          MSG="🚨 **CRITICAL: Quality Gate Failed!**\nCode from **${{ github.actor }}** failed linting or type-checking. Deployment blocked.\n**Check logs:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -H "Content-Type: application/json" -d "{\"content\": \"$MSG\"}" ${{ secrets.DISCORD_WEBHOOK }}

  # ---------------------------------------------------------
  # JOB 2: Vercel Production Deployment
  # ---------------------------------------------------------
  deploy-production:
    name: Deploy to Vercel
    needs: lint-and-typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- NOTIFICATION: PR MERGED / DEPLOY STARTING ---
      - name: Discord Alert - Merge & Deploy Started
        run: |
          MSG="✅ **Code Merged to Main!**\nStarting Vercel Production Deployment for **${{ github.repository }}**..."
          curl -H "Content-Type: application/json" -d "{\"content\": \"$MSG\"}" ${{ secrets.DISCORD_WEBHOOK }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # --- NOTIFICATION: DEPLOY SUCCESS ---
      - name: Discord Alert - Deploy Success
        if: success()
        run: |
          MSG="🎉 **Deployment Successful!**\nYour latest code is now live in production."
          curl -H "Content-Type: application/json" -d "{\"content\": \"$MSG\"}" ${{ secrets.DISCORD_WEBHOOK }}

      # --- NOTIFICATION: DEPLOY FAILED ---
      - name: Discord Alert - Deploy Failed
        if: failure()
        run: |
          MSG="🔥 **URGENT: Deployment Failed!**\nThe Vercel build crashed during deployment.\n**Check Vercel Logs:** https://vercel.com/${{ secrets.VERCEL_ORG_ID }}"
          curl -H "Content-Type: application/json" -d "{\"content\": \"$MSG\"}" ${{ secrets.DISCORD_WEBHOOK }}