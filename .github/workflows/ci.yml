name: CI Quality Gate & Alert

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm ci

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript Type Check
        run: pnpx tsc --noEmit

      # This only runs if the checks FAIL on the main branch
      - name: Discord Alert on Failure
        if: failure() && github.event_name == 'push'
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "🚨 **CRITICAL:** The build is failing on the `main` branch! Someone might have pushed directly or merged a broken PR. Fix immediately!"}' \
          ${{ secrets.DISCORD_WEBHOOK }}